// app/build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

static def envOrDefault(String key, String fallback) {
    def val = System.getenv(key)
    return (val != null && !val.isEmpty()) ? val : fallback
}

android {
    namespace 'com.bepartner.voiceassist'
    compileSdk 34          // ← nâng lên 34 (bắt buộc với AndroidX mới nhất)

    defaultConfig {
        applicationId "com.bepartner.voiceassist"
        minSdk 28          // Android 9 – Realme 2 (không đổi)
        targetSdk 34
        versionCode Integer.parseInt(envOrDefault("BUILD_VERSION_CODE", "1"))
        versionName envOrDefault("BUILD_VERSION_NAME", "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // ── Signing ──────────────────────────────────────────────────
    def ksPath = findProperty("RELEASE_STORE_FILE")?.toString()
    def ksFile = (ksPath != null && new File(ksPath).exists()) ? new File(ksPath) : null

    signingConfigs {
        if (ksFile != null) {
            release {
                storeFile     ksFile
                storePassword findProperty("RELEASE_STORE_PASSWORD")?.toString()
                keyAlias      findProperty("RELEASE_KEY_ALIAS")?.toString()
                keyPassword   findProperty("RELEASE_KEY_PASSWORD")?.toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig = (ksFile != null) ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix  "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            res.srcDirs  = ['../res']
            manifest.srcFile '../AndroidManifest.xml'
        }
    }
}

dependencies {
    // Dùng BOM để tự đồng bộ version toàn bộ AndroidX
    implementation platform('androidx.compose:compose-bom:2024.02.00')

    // Phiên bản cụ thể – tất cả tương thích compileSdk 34
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.3'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
