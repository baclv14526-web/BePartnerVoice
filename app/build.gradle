// app/build.gradle
// AGP 8.5.2 | Gradle 8.7 | compileSdk 34 | minSdk 28 (Android 9)

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Đọc env var an toàn, không bao giờ null ──────────────────────
static def env(String key, String fallback) {
    String val = System.getenv(key)
    return (val != null && !val.trim().isEmpty()) ? val.trim() : fallback
}

// ── Đọc signing params từ project properties (-P flag của Gradle) ─
// findProperty() trả về null nếu không có → dùng ?: '' để tránh NPE
def ksPath     = (findProperty('RELEASE_STORE_FILE')     ?: '').toString().trim()
def ksPw       = (findProperty('RELEASE_STORE_PASSWORD') ?: '').toString().trim()
def ksAlias    = (findProperty('RELEASE_KEY_ALIAS')      ?: '').toString().trim()
def ksPwKey    = (findProperty('RELEASE_KEY_PASSWORD')   ?: '').toString().trim()
def hasKeystore = ksPath != '' && new File(ksPath).exists()

android {
    namespace    'com.bepartner.voiceassist'
    compileSdk   34

    defaultConfig {
        applicationId           'com.bepartner.voiceassist'
        minSdk                  28      // Android 9 – Realme 2
        targetSdk               34
        versionCode             Integer.parseInt(env('BUILD_VERSION_CODE', '1'))
        versionName             env('BUILD_VERSION_NAME', '1.0.0')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // ── Signing configs ────────────────────────────────────────────
    signingConfigs {
        debug {
            // default debug keystore – luôn tồn tại trên runner
        }
        release {
            if (hasKeystore) {
                storeFile     file(ksPath)
                storePassword ksPw
                keyAlias      ksAlias
                keyPassword   ksPwKey
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles   getDefaultProguardFile('proguard-android-optimize.txt'),
                            'proguard-rules.pro'
            signingConfig   hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // ── Source layout: tất cả source nằm ở root, module chỉ là app/ ─
    sourceSets {
        main {
            java.srcDirs      = [rootProject.file('src').absolutePath]
            res.srcDirs       = [rootProject.file('res').absolutePath]
            manifest.srcFile    rootProject.file('AndroidManifest.xml').absolutePath
        }
    }
}

dependencies {
    // Tất cả version dưới đây đều tương thích compileSdk 34 + minSdk 28
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.3'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
