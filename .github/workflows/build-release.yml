name: 🎤 Build & Release BePartner Voice APK

# Trigger: push lên main hoặc chạy tay
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cần quyền write để tạo Release và tag
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. CHECKOUT SOURCE CODE
      # ──────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. JAVA 17 (bắt buộc cho AGP 8.x, keytool có sẵn)
      # ──────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ──────────────────────────────────────────
      # 3. ANDROID SDK (command-line tools)
      #    ubuntu-latest đã có $ANDROID_HOME nhưng
      #    thiếu build-tools + platform. Cài thêm ở đây.
      # ──────────────────────────────────────────
      - name: Install Android SDK components
        run: |
          set -e
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Nếu sdkmanager chưa có (runner cũ), tải cmdline-tools
          if [ ! -f "$SDK_MGR" ]; then
            echo "Downloading Android cmdline-tools..."
            TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            wget -q "$TOOLS_URL" -O /tmp/cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          # Chấp nhận license không cần nhập tay
          yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true

          # Cài đúng API + build-tools mà build.gradle yêu cầu
          # compileSdk 33 → platforms;android-33
          # minSdk 28     → platforms;android-28 (runner test)
          "$SDK_MGR" \
            "platforms;android-33" \
            "platforms;android-28" \
            "build-tools;33.0.2" \
            "platform-tools"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK setup ✓"

      # ──────────────────────────────────────────
      # 4. GRADLE WRAPPER (tạo nếu chưa có)
      #    Dùng Gradle 8.6 – tương thích AGP 8.3+
      # ──────────────────────────────────────────
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found – generating..."
            gradle wrapper --gradle-version=8.6 --distribution-type=bin
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      # ──────────────────────────────────────────
      # 5. CACHE GRADLE – tăng tốc build lần sau
      # ──────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ──────────────────────────────────────────
      # 6. TẠO KEYSTORE TỰ ĐỘNG (không cần secret)
      #    Mật khẩu ngẫu nhiên, chỉ dùng trong job này
      # ──────────────────────────────────────────
      - name: Generate ephemeral keystore
        run: |
          set -e
          KS_FILE="${GITHUB_WORKSPACE}/release.keystore.jks"
          KS_PW=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          K_ALIAS="bepartner"

          # Ẩn password trong log
          echo "::add-mask::$KS_PW"

          keytool -genkeypair -v \
            -keystore "$KS_FILE" \
            -alias "$K_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PW" -keypass "$KS_PW" \
            -dname "CN=BePartnerVoice, OU=Driver, O=Personal, L=HaNoi, S=HaNoi, C=VN"

          echo "KEYSTORE_PATH=$KS_FILE"       >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW"     >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$K_ALIAS"           >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_PW"          >> "$GITHUB_ENV"
          echo "Keystore generated ✓"

      # ──────────────────────────────────────────
      # 7. TRUYỀN SIGNING CONFIG VÀO GRADLE
      #    Dùng gradle.properties ở workspace
      #    để build.gradle đọc được mà không cần
      #    hardcode đường dẫn trong source.
      # ──────────────────────────────────────────
      - name: Inject signing config into gradle.properties
        run: |
          cat >> gradle.properties << EOF

          # Auto-injected by CI – signing config
          RELEASE_STORE_FILE=${KEYSTORE_PATH}
          RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          RELEASE_KEY_ALIAS=${KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      # ──────────────────────────────────────────
      # 8. BUILD RELEASE APK
      # ──────────────────────────────────────────
      - name: Build signed release APK
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --stacktrace \
            -Pandroid.injected.signing.store.file="${KEYSTORE_PATH}" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      # ──────────────────────────────────────────
      # 9. XÓA KEYSTORE NGAY SAU KHI BUILD XONG
      # ──────────────────────────────────────────
      - name: Delete keystore from runner
        if: always()
        run: |
          rm -f release.keystore.jks
          # Xóa password khỏi gradle.properties
          sed -i '/^RELEASE_/d' gradle.properties
          echo "Keystore deleted ✓"

      # ──────────────────────────────────────────
      # 10. KIỂM TRA APK TỒN TẠI
      # ──────────────────────────────────────────
      - name: Verify APK output
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            ls -la app/build/outputs/apk/release/ || echo "Release dir missing"
            exit 1
          fi
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ APK built successfully – size: $SIZE"

      # ──────────────────────────────────────────
      # 11. ĐẶT TÊN FILE APK
      # ──────────────────────────────────────────
      - name: Rename and stage APK
        run: |
          mkdir -p out
          VERSION="1.0.${{ github.run_number }}"
          APK_NAME="BePartnerVoice-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Staged: out/${APK_NAME}"

      # ──────────────────────────────────────────
      # 12. UPLOAD ARTIFACT (backup, lưu 30 ngày)
      # ──────────────────────────────────────────
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BePartnerVoice-build-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # ──────────────────────────────────────────
      # 13. PUBLISH GITHUB RELEASE
      #     tag "latest" bị update mỗi lần build
      #     → link tải luôn trỏ về bản mới nhất
      # ──────────────────────────────────────────
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🎤 BePartner Voice v${{ env.APK_VERSION }}"
          body: |
            ## BePartner Voice Control – build #${{ github.run_number }}

            Điều khiển BeBike Partner bằng giọng nói, rảnh tay lái xe.

            ### 📲 Cách cài đặt trên Realme 2 (Android 9)

            1. Mở link file `.apk` bên dưới bằng **Chrome** trên điện thoại
            2. Nhấn **Download** → chờ tải xong
            3. Kéo thanh thông báo → nhấn file vừa tải
            4. Nếu bị chặn: Cài đặt → Bảo mật → **Cho phép cài từ nguồn không xác định** → bật cho Chrome
            5. Nhấn **Cài đặt** → **Mở**
            6. Làm theo 3 bước trong app (Accessibility + Overlay + Mic)

            > ⚠️ **Chú ý:** Mỗi lần build dùng chữ ký mới.
            > Nếu đã cài bản cũ → **gỡ cài đặt trước** rồi mới cài bản này.

            ---
            **Commit:** `${{ github.sha }}`
            **Build:** `#${{ github.run_number }}`
          files: out/*.apk
          make_latest: true
