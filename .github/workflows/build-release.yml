name: 🎤 Build & Release BePartner Voice APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ── 1. CHECKOUT ───────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. JDK 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ── 3. ANDROID SDK ────────────────────────────────────────────
      - name: Install Android SDK components
        run: |
          set -e
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDK_MGR" ]; then
            echo "Downloading cmdline-tools..."
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
                 -O /tmp/cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "platforms;android-28" \
            "build-tools;34.0.0" \
            "platform-tools"

      # ── 4. GRADLE WRAPPER ─────────────────────────────────────────
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version=8.6 --distribution-type=bin
          fi
          chmod +x gradlew

      # ── 5. CACHE GRADLE ───────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 6. TẠO KEYSTORE ───────────────────────────────────────────
      - name: Generate ephemeral keystore
        run: |
          set -e
          KS_FILE="${GITHUB_WORKSPACE}/release.keystore.jks"
          KS_PW=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          K_ALIAS="bepartner"

          echo "::add-mask::$KS_PW"

          keytool -genkeypair -v \
            -keystore "$KS_FILE" \
            -alias "$K_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PW" -keypass "$KS_PW" \
            -dname "CN=BePartnerVoice, OU=Driver, O=Personal, L=HaNoi, S=HaNoi, C=VN"

          echo "KEYSTORE_PATH=$KS_FILE"   >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$K_ALIAS"       >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_PW"      >> "$GITHUB_ENV"
          echo "Keystore generated ✓"

      # ── 7. BUILD & KÝ APK ─────────────────────────────────────────
      # Truyền tất cả signing params qua -P (Gradle project properties)
      # và version qua env. Không động vào gradle.properties.
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --stacktrace \
            -PRELEASE_STORE_FILE="${{ env.KEYSTORE_PATH }}" \
            -PRELEASE_STORE_PASSWORD="${{ env.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ env.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ env.KEY_PASSWORD }}"
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: "1.0.${{ github.run_number }}"

      # ── 8. XÓA KEYSTORE ───────────────────────────────────────────
      - name: Delete keystore from runner
        if: always()
        run: rm -f "${{ env.KEYSTORE_PATH }}"

      # ── 9. KIỂM TRA & ĐẶT TÊN APK ────────────────────────────────
      - name: Verify and rename APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ APK not found!"
            find app/build/outputs -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          mkdir -p out
          VERSION="1.0.${{ github.run_number }}"
          cp "$APK" "out/BePartnerVoice-v${VERSION}.apk"
          echo "✅ $(du -h out/*.apk)"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      # ── 10. ARTIFACT (backup 30 ngày) ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BePartnerVoice-build-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # ── 11. GITHUB RELEASE ────────────────────────────────────────
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🎤 BePartner Voice v${{ env.APK_VERSION }}"
          body: |
            ## BePartner Voice Control – build #${{ github.run_number }}

            Điều khiển BeBike Partner bằng giọng nói, rảnh tay lái xe.

            ### 📲 Cách cài trên Realme 2 (Android 9)
            1. Mở link file `.apk` bên dưới bằng **Chrome** trên điện thoại
            2. Tải về → kéo thanh thông báo → nhấn file vừa tải
            3. Nếu bị chặn: Cài đặt → Bảo mật → **Nguồn không xác định** → bật Chrome
            4. Làm theo 3 bước trong app (Accessibility + Overlay + Mic)

            > ⚠️ Mỗi build dùng chữ ký mới → cần **gỡ bản cũ** trước khi cài.

            **Commit:** `${{ github.sha }}`
          files: out/*.apk
          make_latest: true
