name: 🎤 Build & Release BePartner Voice APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:

      # ── 1. CHECKOUT ───────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. JDK 17 ─────────────────────────────────────────────────
      # KHÔNG dùng cache: gradle ở đây để tránh conflict với cache step sau
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. ANDROID SDK ────────────────────────────────────────────
      # ubuntu-latest đã có ANDROID_HOME và cmdline-tools nhưng thiếu
      # platform 34 và build-tools 34. Cài thêm ở đây.
      - name: Install Android SDK components
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Nếu sdkmanager chưa có thì tải về
          if [ ! -f "$SDKM" ]; then
            echo "Downloading cmdline-tools..."
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
                 -O /tmp/cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
               "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          # Chấp nhận toàn bộ license không cần nhập tay
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          # Cài platform + build-tools khớp với compileSdk 34
          "$SDKM" \
            "platforms;android-34" \
            "platforms;android-28" \
            "build-tools;34.0.0" \
            "platform-tools"

          echo "Android SDK ✓"

      # ── 4. GRADLE WRAPPER ─────────────────────────────────────────
      # gradlew phải có sẵn trong repo. Nếu không có thì tạo mới.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating..."
            # Dùng gradle system (không phải ./gradlew) để tạo wrapper
            gradle wrapper --gradle-version=8.7 --distribution-type=bin
          fi
          chmod +x gradlew
          echo "Gradle wrapper ✓"

      # ── 5. CACHE GRADLE ───────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 6. TẠO KEYSTORE TỰ ĐỘNG ───────────────────────────────────
      # Mật khẩu ngẫu nhiên 24 ký tự, bị mask trong log, xóa sau khi build.
      # Không cần secret nào được cấu hình trước.
      - name: Generate ephemeral keystore
        run: |
          set -e
          KS_FILE="${GITHUB_WORKSPACE}/release.keystore.jks"
          KS_PW=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          K_ALIAS="bepartner"

          # Ẩn password khỏi log
          echo "::add-mask::${KS_PW}"

          keytool -genkeypair -v \
            -keystore  "${KS_FILE}" \
            -alias     "${K_ALIAS}" \
            -keyalg    RSA \
            -keysize   2048 \
            -validity  10000 \
            -storepass "${KS_PW}" \
            -keypass   "${KS_PW}" \
            -dname     "CN=BePartnerVoice,OU=Driver,O=Personal,L=HaNoi,S=HaNoi,C=VN" \
            -noprompt

          # Lưu vào GITHUB_ENV để các step sau dùng
          echo "KS_FILE=${KS_FILE}"  >> "$GITHUB_ENV"
          echo "KS_PW=${KS_PW}"      >> "$GITHUB_ENV"
          echo "K_ALIAS=${K_ALIAS}"  >> "$GITHUB_ENV"
          echo "Keystore generated ✓"

      # ── 7. BUILD & KÝ APK ─────────────────────────────────────────
      # Truyền signing qua -P (project property), không dùng gradle.properties
      # để tránh mật khẩu bị lưu vào file trong repo.
      - name: Build signed release APK
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PRELEASE_STORE_FILE="${{ env.KS_FILE }}" \
            -PRELEASE_STORE_PASSWORD="${{ env.KS_PW }}" \
            -PRELEASE_KEY_ALIAS="${{ env.K_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ env.KS_PW }}"

      # ── 8. XÓA KEYSTORE NGAY SAU BUILD ───────────────────────────
      - name: Delete keystore
        if: always()
        run: |
          rm -f "${{ env.KS_FILE }}"
          echo "Keystore deleted ✓"

      # ── 9. KIỂM TRA APK & ĐẶT TÊN ────────────────────────────────
      - name: Verify and stage APK
        run: |
          set -e
          APK_SRC="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_SRC" ]; then
            echo "❌ APK not found at $APK_SRC"
            echo "Contents of outputs dir:"
            find app/build/outputs -type f 2>/dev/null || echo "(empty)"
            exit 1
          fi

          mkdir -p out
          VERSION="1.0.${{ github.run_number }}"
          APK_NAME="BePartnerVoice-v${VERSION}.apk"
          cp "$APK_SRC" "out/${APK_NAME}"

          SIZE=$(du -h "out/${APK_NAME}" | cut -f1)
          echo "✅ APK ready: ${APK_NAME} (${SIZE})"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK_NAME=${APK_NAME}"   >> "$GITHUB_ENV"

      # ── 10. UPLOAD ARTIFACT (lưu 30 ngày, backup) ─────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BePartnerVoice-build-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # ── 11. GITHUB RELEASE ────────────────────────────────────────
      # tag_name: latest bị ghi đè mỗi lần build → link tải luôn mới nhất
      # update_release: true để không bị lỗi khi tag đã tồn tại
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🎤 BePartner Voice v${{ env.APK_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            ## 🎤 BePartner Voice – build #${{ github.run_number }}

            Điều khiển BeBike Partner bằng **giọng nói tiếng Việt**, rảnh tay lái xe an toàn.

            ---

            ### 📲 Cài đặt trên Realme 2 (Android 9)

            1. Nhấn vào file `.apk` bên dưới để tải
            2. Mở file vừa tải từ thanh thông báo
            3. Nếu bị chặn → **Cài đặt → Bảo mật → Nguồn không xác định → Bật cho Chrome**
            4. Nhấn **Cài đặt**
            5. Mở app, làm theo 3 bước: **Accessibility → Overlay → Microphone**

            ---

            ### 🎤 Lệnh giọng nói

            | Nói | Tác dụng |
            |-----|----------|
            | "Đã đến điểm đón" | Nhấn nút [Đã đến] |
            | "Bắt đầu chuyến đi" | Nhấn nút [Bắt đầu] |
            | "Trả khách" | Nhấn nút [Hoàn thành] |
            | "Chấp nhận chuyến" | Nhấn nút [Chấp nhận] |
            | "Từ chối" | Nhấn nút [Từ chối] |
            | "Online" / "Offline" | Bật/tắt nhận chuyến |

            ---

            > ⚠️ **Lưu ý:** Mỗi lần build dùng chữ ký mới.
            > Nếu đã cài bản cũ, hãy **gỡ cài đặt trước** rồi mới cài bản này.

            **Commit:** `${{ github.sha }}`
          files: out/*.apk
